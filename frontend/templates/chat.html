{% extends "base.html" %}
{% block topbar %}<span id="convTitle"></span>{% endblock %}
{% block content %}
<div class="chat-scroll" id="chatScroll">
  <div class="welcome" id="welcome" hidden>
    <h1><span class="spark">✻</span> <span id="greeting">你好</span>，{{ me.name or me.username }}</h1>
    <p>描述你的应用场景和电气需求，我会从太矽电子产品库中为你推荐合适的芯片。</p>
  </div>
  <div class="thread" id="thread"></div>
</div>
<div class="composer-wrap">
  <form class="composer" id="composer">
    <div class="attach-list" id="attachList" hidden></div>
    <textarea id="input" rows="1" placeholder="例如：锂电池供电，需要 3.3V/200mA 输出；也可附上竞品 datasheet / 需求文档…" autofocus></textarea>
    <div class="composer-bar">
      <div class="composer-left">
        <button type="button" class="icon-btn attach-btn" id="attachBtn" title="上传附件（PDF/Word/Excel/文本）" aria-label="上传附件">📎</button>
        <span class="muted small">Enter 发送 · Shift+Enter 换行</span>
      </div>
      <button class="send-btn" id="sendBtn" type="submit" disabled aria-label="发送">↑</button>
    </div>
    <input type="file" id="fileInput" multiple hidden
           accept=".pdf,.docx,.xlsx,.xlsm,.csv,.tsv,.txt,.md,.markdown,.log,.json,.xml,.html,.htm,.c,.h,.cpp,.hpp,.py,.js,.sql,.yaml,.yml">
  </form>
  <div class="suggests" id="suggests" hidden>
    <button type="button">12V 转 3.3V，300mA，SOT23 封装的 LDO</button>
    <button type="button">24V 输入降压到 5V/2A 的 DC-DC 方案</button>
    <button type="button">直流无刷风扇用的霍尔芯片推荐</button>
    <button type="button">单节锂电池充电管理芯片</button>
    <button type="button">低功耗电池门磁检测，用全极霍尔开关</button>
    <button type="button">需要 RS-485 收发器，3.3V 供电</button>
  </div>
  <div class="disclaimer">AI 推荐仅供参考，最终选型请以数据手册及太矽电子 FAE 确认为准。</div>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='vendor/marked.min.js') }}"></script>
<script src="{{ url_for('static', filename='vendor/purify.min.js') }}"></script>
<script src="{{ url_for('static', filename='js/chat.js') }}"></script>
{% endblock %}
